<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS2 Upgrader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b08; --panel:rgba(12,22,17,.9); --panel2:#16251e; --line:rgba(120,255,170,.10);
  --text:#ecfaf1; --muted:#86a395; --accent:#2ee66b; --accent2:#c6ff5a; --win:#3ddc84; --lose:#ef5350;
  --r-ww:#b0c3d9; --r-ind:#5e98d9; --r-mil:#4b69ff; --r-res:#8847ff;
  --r-cls:#d32ce6; --r-cov:#eb4b4b; --r-gold:#e4ae39;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scrollbar-color:#244033 transparent}
body{color:var(--text);font-family:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;font-size:17px;
  font-weight:500;min-height:100vh;background-color:var(--bg);
  background-image:
    radial-gradient(900px 500px at 8% -5%,rgba(46,230,107,.14),transparent 60%),
    radial-gradient(800px 600px at 100% 100%,rgba(0,200,160,.10),transparent 60%),
    linear-gradient(rgba(120,255,170,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,255,170,.026) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#244033;border-radius:8px}
*::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
option{background:#16251e;color:var(--text)}

/* ===== Шапка ===== */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:10px 24px;border-bottom:1px solid var(--line);background:rgba(5,11,8,.84);
  position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent)}
.logo .lg{width:28px;height:28px;filter:drop-shadow(0 0 6px rgba(46,230,107,.6))}
.logo .lt{font-size:25px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.logo .lt b{color:var(--accent)}
.logo .ls{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  border-left:1px solid var(--line);padding-left:10px}
.nav{display:flex;gap:4px;background:rgba(0,0,0,.35);padding:4px;border-radius:12px}
.nav button{background:transparent;padding:7px 20px;border-radius:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;font-size:15px;color:var(--muted);transition:.15s}
.nav button:hover{color:var(--text)}
.nav button.on{background:linear-gradient(135deg,#4cf08c,#17b556);color:#03210f;box-shadow:0 4px 14px rgba(46,230,107,.3)}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.balance{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#1a2c23,#12201a);
  border:1px solid var(--line);padding:6px 14px;border-radius:10px;font-weight:600;font-size:16px}
.balance::before,.pr::before,.coin::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff1a8,#f5a623 60%,#b8741a)}
.balance b{color:var(--accent2);font-size:20px}
.timer{position:relative;font-size:13px;font-weight:600;color:var(--accent);background:#0f1a15;border:1px solid var(--line);
  padding:6px 12px 10px;border-radius:10px;overflow:hidden}
.timer .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.timer .bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#17b556,#c6ff5a);transition:width .5s linear}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:#12201a;padding:7px 12px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.lang button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04210f}

/* ===== Сторінки ===== */
main{max-width:1560px;margin:0 auto;padding:14px 24px 30px}
.page{display:none}
.page.on{display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.icons{display:flex;gap:8px}
.ib{width:34px;height:34px;border-radius:50%;background:#14231b;border:1px solid var(--line);color:var(--muted);
  font-size:16px;font-weight:700;display:grid;place-items:center;transition:.15s}
.ib:hover{color:var(--text);border-color:rgba(46,230,107,.6)}
.ib.on{color:var(--accent2);border-color:rgba(198,255,90,.55);box-shadow:0 0 12px rgba(198,255,90,.25)}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(120,255,170,.05);border:1px solid var(--line);border-radius:20px;padding:3px 14px;
  font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pill b{color:var(--accent2);font-size:16px;margin-left:2px}

/* ===== Кнопки ===== */
.btn{background:linear-gradient(180deg,#1f3329,#15251d);border:1px solid var(--line);padding:8px 14px;
  border-radius:10px;font-weight:600;letter-spacing:.03em;transition:.15s}
.btn:hover{border-color:rgba(46,230,107,.65);box-shadow:0 0 14px rgba(46,230,107,.18)}
.btn.small{padding:3px 10px;font-size:14px;border-radius:8px}
.btn.primary{background:linear-gradient(135deg,#4cf08c,#17b556);color:#03210f;font-weight:700;border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* ===== Три колонки апгрейдера ===== */
.upg{display:grid;grid-template-columns:minmax(290px,1fr) minmax(330px,430px) minmax(290px,1fr);gap:22px;align-items:start}
@media(max-width:1100px){.upg{grid-template-columns:1fr}.stage{order:-1}}
.sidecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.side{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);
  border-radius:18px;padding:14px;display:flex;flex-direction:column;height:600px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 36px rgba(0,0,0,.45)}
.side-head{text-align:center;margin-bottom:6px}
.side-head h3{font-size:17px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-head p{font-size:13px;color:var(--muted);margin-top:2px;min-height:16px}
.preview{position:relative;height:150px;flex:none;margin-bottom:8px;border-radius:14px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 55%,rgba(198,255,90,.16),transparent 62%)}
.empty-view{position:relative;width:100%;height:100%;display:grid;place-items:center}
.empty-view .ghost{position:absolute;width:92%;opacity:.07;filter:blur(.3px)}
.empty-view .chev{position:relative;width:84px;height:84px;filter:drop-shadow(0 0 14px rgba(198,255,90,.55))}
.thumbs{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px}
.thumbs .th{width:92px;height:64px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 34%,transparent),rgba(0,0,0,.25) 75%);box-shadow:inset 0 -3px 0 var(--rc)}
.thumbs .th img,.thumbs .th svg{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.thumbs .more{font-weight:700;color:var(--accent2);font-size:20px}
.tbig{display:grid;place-items:center;width:100%;height:100%;padding:6px;
  background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 66%)}
.tbig img,.tbig svg{max-width:78%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.65))}
.subhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tools input{flex:1 1 100%}
.tools select{flex:1 1 96px}
.tools input,.tools select{min-width:0;background:#0b130f;border:1px solid var(--line);color:var(--text);
  padding:6px 10px;border-radius:9px;font:inherit;font-size:15px}

/* нижні панелі під колонками */
.balbar{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bb-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.bb-top b{display:flex;align-items:center;gap:6px;color:var(--accent2);font-size:17px}
.bb-top small{color:var(--muted);font-weight:500;font-size:12px}
.coin{display:inline-flex}
.balbar input[type=range],.quick+*{width:100%}
.balbar input[type=range]{margin-top:6px;accent-color:var(--accent2);cursor:pointer}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.q{flex:1;min-width:44px;padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  font-weight:700;font-size:16px;color:var(--text);transition:.15s}
.q:hover{background:rgba(46,230,107,.14);border-color:rgba(46,230,107,.6)}
.q.c1{border-color:#2c7a52;color:#79e3a6}
.q.c2{border-color:#9bd33a;color:#d4f56a}
.q.c3{border-color:#3ddc84;color:#8dffb8}
.q.gear{flex:0 0 46px;color:var(--muted)}

/* ===== Скіни ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;overflow:auto;
  padding:2px 4px 4px 2px;flex:1;min-height:0;align-content:start}
.skin{position:relative;background:linear-gradient(180deg,#1c2e25,#111d17);border:1px solid var(--line);
  border-radius:12px;padding:7px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;user-select:none;
  box-shadow:inset 0 -3px 0 var(--rc);content-visibility:auto;contain-intrinsic-size:150px 160px}
.skin:hover{transform:translateY(-3px);box-shadow:inset 0 -3px 0 var(--rc),0 10px 24px color-mix(in srgb,var(--rc) 30%,transparent)}
.skin.sel{outline:2px solid var(--accent);background:linear-gradient(180deg,#1f4030,#12261b)}
.skin.hit{outline:2px solid var(--accent2);box-shadow:inset 0 -3px 0 var(--rc),0 0 24px rgba(198,255,90,.55)}
.skin .pic{height:56px;border-radius:8px;margin-bottom:4px;display:grid;place-items:center;
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 36%,transparent),transparent 72%)}
.pic svg,.pic img{width:92%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.skin .wp{font-size:11px;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin .nm{font-size:14px;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin .pr{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;color:var(--accent2);font-size:15px;margin-top:2px}
.skin .pr::before{width:9px;height:9px}
.wear{position:absolute;top:5px;left:5px;z-index:1;font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;
  background:rgba(0,0,0,.5);letter-spacing:.05em}
.w-FN{color:#7dffb0}.w-FT{color:#e0f080}.w-BS{color:#ff9d8a}
.skin .act{display:none;margin-top:5px;width:100%;font-size:12px;font-weight:600;padding:3px;border-radius:8px;
  background:#0b130f;border:1px solid var(--line)}
.skin:hover .act{display:block}
@media(hover:none){.skin .act{display:block}}
.empty{color:var(--muted);font-size:15px;padding:24px 10px;text-align:center;grid-column:1/-1}

/* ===== Колесо ===== */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheelbox{position:relative;width:min(100%,410px);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(61,220,132,.14))}
.wheelbox::before{content:"";position:absolute;inset:-12%;z-index:-1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(61,220,132,.12),transparent 62%)}
.wheelbox svg{width:100%;height:100%}
#arc{filter:drop-shadow(0 0 6px rgba(61,220,132,.8))}
#ptr{filter:drop-shadow(0 0 5px rgba(200,255,220,.9))}
.lbl text{font-size:6.5px;fill:#7c978a;text-anchor:middle;font-weight:600}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none}
.center .pct{font-size:50px;font-weight:700;line-height:1;letter-spacing:.01em;color:#b8f23d;text-shadow:0 0 18px rgba(150,255,60,.45)}
.center .sub{font-size:14px;color:#8fb09f;margin-top:2px}
.wheelbox.flash-win{animation:fwin 1.2s ease-out}
.wheelbox.flash-lose{animation:flose .55s ease-out}
@keyframes fwin{0%{filter:drop-shadow(0 0 0 #3ddc84)}30%{filter:drop-shadow(0 0 46px #3ddc84) brightness(1.3)}100%{filter:drop-shadow(0 0 22px rgba(61,220,132,.14))}}
@keyframes flose{0%,100%{transform:none;filter:drop-shadow(0 0 22px rgba(61,220,132,.14))}
  20%{transform:translateX(-9px);filter:drop-shadow(0 0 30px #ef5350)}40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.manual{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;font-size:15px;font-weight:600;color:var(--muted)}
.manual input{flex:1;max-width:240px;accent-color:var(--accent2);cursor:pointer}
.manual b{min-width:58px;color:var(--accent2);font-size:17px}
.duel{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:104px}
.duel:empty{min-height:0}
.duel .dl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}
.duel .dr{flex:0 0 auto}
.darrow{color:var(--accent2);font-size:24px;text-shadow:0 0 12px rgba(198,255,90,.6);flex:none}
.dc{position:relative;width:94px;background:linear-gradient(180deg,#1c2e25,#111d17);border:1px solid var(--line);
  border-radius:11px;padding:5px;text-align:center;box-shadow:inset 0 -3px 0 var(--rc,#2f8f5a);transition:.3s}
.dc .pic{height:42px;margin-bottom:2px;display:grid;place-items:center;
  background:radial-gradient(circle,color-mix(in srgb,var(--rc,#2f8f5a) 34%,transparent),transparent 72%)}
.dc .dn2{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .pr{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--accent2)}
.dc .pr::before{width:8px;height:8px}
.dc.ghost{display:grid;place-items:center;height:78px;color:var(--muted);font-size:26px;border-style:dashed}
.dc.won{outline:2px solid var(--win);box-shadow:inset 0 -3px 0 var(--rc),0 0 24px rgba(61,220,132,.7);transform:scale(1.08)}
.dc.lost{opacity:.5;filter:grayscale(.7);outline:2px solid var(--lose)}
.dmore{align-self:center;font-weight:700;color:var(--accent2);font-size:18px}
.sumline{display:flex;gap:10px;width:100%;justify-content:center}
.sumline span{flex:1;background:rgba(120,255,170,.04);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}
.sumline small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.sumline b{display:block;font-size:19px;color:var(--text)}
.go{width:100%;padding:13px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;border-radius:14px;
  box-shadow:0 10px 28px rgba(30,200,90,.35)}
.go:not(:disabled):not(.skip){animation:pulse 2s ease-in-out infinite}
.go.skip{background:linear-gradient(180deg,#26382f,#1a2922);color:var(--text);box-shadow:none;font-size:18px}
@keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(30,200,90,.3)}50%{box-shadow:0 10px 42px rgba(60,240,120,.65)}}
.result{min-height:30px;font-weight:700;font-size:21px;text-align:center;letter-spacing:.03em}
.result.win{color:var(--win)}
.result.lose{color:var(--lose)}
.note{font-size:12px;color:var(--muted);text-align:center;max-width:390px;line-height:1.3}

/* ===== Стрічка подій ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 36px rgba(0,0,0,.45)}
.panel h2{font-size:17px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--accent2),var(--accent))}
.feedbox{margin-top:20px}
.feed{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:15px}
.feed div{background:rgba(120,255,170,.04);border-left:3px solid var(--line);padding:6px 10px;border-radius:8px;line-height:1.3}
.feed .f-win,.feed .f-case{border-left-color:var(--win)}
.feed .f-lose{border-left-color:var(--lose)}
.feed .f-adv{border-left-color:var(--accent2)}
.feed small{color:var(--muted);margin-right:8px}

/* ===== Кейси ===== */
.cases-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cases-bar input,.cases-bar select{background:#0b130f;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-size:16px}
.cases-bar input{flex:1;min-width:200px;max-width:420px}
.ccount{margin-left:auto;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.case{background:linear-gradient(180deg,#1c2e25,#111d17);border:1px solid var(--line);border-radius:14px;
  padding:10px;text-align:center;box-shadow:inset 0 -3px 0 var(--cc);transition:.15s;content-visibility:auto;contain-intrinsic-size:150px 190px}
.case:hover{transform:translateY(-3px);box-shadow:inset 0 -3px 0 var(--cc),0 10px 24px color-mix(in srgb,var(--cc) 35%,transparent)}
.case .box{height:76px;display:grid;place-items:center;margin-bottom:4px;
  background:radial-gradient(circle,color-mix(in srgb,var(--cc) 32%,transparent),transparent 70%)}
.case .box svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}
.case .nm{font-weight:700;font-size:15px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case .rng{font-size:13px;color:var(--muted);margin-bottom:6px}
.case .btn{width:100%}
.strip{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;display:none;background:#08110d}
.strip.on{display:block}
.strip::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,#08110d 0,transparent 16%,transparent 84%,#08110d 100%)}
.strip::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;z-index:3;
  background:linear-gradient(var(--accent2),var(--accent));box-shadow:0 0 12px var(--accent)}
.reel{display:flex;gap:4px;padding:6px;will-change:transform}
.reel .skin{flex:0 0 100px;cursor:default}
.reel .skin:hover{transform:none}

/* ===== Адвент-календар ===== */
.adv-wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.adv-hero{border-radius:16px;padding:16px;border:1px solid rgba(46,230,107,.3);
  background:radial-gradient(400px 160px at 100% 0,rgba(198,255,90,.16),transparent 70%),
             linear-gradient(135deg,rgba(46,230,107,.18),rgba(46,230,107,.04))}
.ah-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ah-month{font-size:26px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ah-streak{color:var(--accent2);font-weight:700;font-size:16px;white-space:nowrap}
.ah-prog{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:14px;color:var(--muted)}
.ah-prog i{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.ah-prog u{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#17b556,#c6ff5a);box-shadow:0 0 12px rgba(150,255,100,.6)}
.ah-today{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.32);
  border:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--rc,transparent)}
.ah-ico{width:72px;height:54px;flex:none;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.ah-ico svg,.ah-ico img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.ah-txt{flex:1;min-width:0}
.ah-txt small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ah-txt b{display:block;font-size:20px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah-today .btn.primary{padding:10px 18px;font-size:17px;text-transform:uppercase;letter-spacing:.1em;animation:pulse 2s ease-in-out infinite}
.ah-next{text-align:right;font-size:12px;color:var(--muted);letter-spacing:.06em}
.ah-next b{display:block;font-size:19px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.adv-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.adv{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.door{position:relative;aspect-ratio:1/1.1;min-height:72px;border-radius:12px;padding:4px 3px 5px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#1c2e25,#101b15);border:1px solid var(--line)}
.door.ghost{background:none;border:0}
.door .dn{position:absolute;top:3px;left:6px;font-size:12px;font-weight:700;color:var(--muted);z-index:1}
.door .di{flex:1;width:100%;display:grid;place-items:center;padding-top:12px;min-height:0}
.door .di svg,.door .di img{width:80%;height:100%;max-height:38px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.door .dl{font-size:11px;font-weight:700;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.door .stamp{position:absolute;right:3px;top:2px;font-style:normal;font-size:12px;z-index:1}
.door.k-chest{border-color:rgba(198,255,90,.35);background:linear-gradient(180deg,#25402b,#12241a)}
.door.k-skin{box-shadow:inset 0 -3px 0 var(--rc),0 0 14px color-mix(in srgb,var(--rc) 32%,transparent)}
.door.k-skin::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);
  transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
.door.done{border-color:rgba(46,230,107,.55);background:linear-gradient(180deg,#1d4a31,#112e1e)}
.door.done .di,.door.done .dl{opacity:.4}
.door.done::after,.door.miss::after{display:none}
.door.done .stamp{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#03210f;display:grid;place-items:center;font-size:11px;font-weight:700}
.door.miss{opacity:.38;filter:grayscale(.75)}
.door.miss .stamp{color:#ff8080}
.door.lock{opacity:.82}
.door.lock .di{filter:saturate(.5) brightness(.85)}
.door.today{cursor:pointer;border-color:var(--accent2);animation:glow 1.8s ease-in-out infinite}
.door.today:hover{transform:translateY(-2px)}
.door.pop{animation:pop .6s ease-out}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(198,255,90,0)}50%{box-shadow:0 0 18px rgba(198,255,90,.65)}}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ===== Вікна ===== */
.overlay{position:fixed;inset:0;background:rgba(3,8,6,.88);display:grid;place-items:center;z-index:20;padding:20px;backdrop-filter:blur(4px)}
.overlay.hide{display:none}
.joinbox{background:#101c16;border:1px solid var(--line);border-radius:16px;padding:24px;
  width:min(100%,430px);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.joinbox h1{font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.joinbox label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.joinbox input[type=number]{background:#08110d;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit}
.infop{color:#bfd6c9;font-size:16px;line-height:1.35}

.ww{--rc:var(--r-ww)} .ind{--rc:var(--r-ind)} .mil{--rc:var(--r-mil)} .res{--rc:var(--r-res)}
.cls{--rc:var(--r-cls)} .cov{--rc:var(--r-cov)} .gold{--rc:var(--r-gold)}

@media(max-width:560px){.ah-today{flex-wrap:wrap}.door .dl{font-size:10px}.nav button{padding:7px 12px}}
@media(prefers-reduced-motion:reduce){.skin,.case{transition:none}.go,.door,.ah-ico,.ah-today .btn{animation:none!important}.door::after{display:none}.wheelbox{animation:none!important}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#050b08;pointer-events:none}

const norm = s => s.replace(/^★\s*/, "").replace(/^(StatTrak™|Souvenir)\s*/, "").replace(/\s*\([^)]*\)\s*$/, "").trim().toLowerCase();
async function loadImages(){
  let ts = 0; try{ ts = +localStorage.getItem("upg_img3_t") || 0; }catch(e){}
  if(Date.now() - ts < 7 * 864e5 && BASE.some(b => IMG[b[0]])) return;     // не частіше разу на тиждень
  try{
    const list = await (await fetch("https://bymykel.github.io/CSGO-API/api/en/skins.json")).json();
    const m = {}; list.forEach(s => { if(s.image) m[norm(s.name)] = s.image; });
    BASE.forEach(b => { const u = m[norm(b[0])]; if(u) IMG[b[0]] = u; });
    try{ localStorage.setItem("upg_img3", JSON.stringify(IMG)); localStorage.setItem("upg_img3_t", String(Date.now())); }catch(e){}
    renderEverything();
  }catch(e){}   // без інтернету лишаються малюнки SVG
}
function picture(c){
  const u = c[6] || IMG[c[7]];
  return u ? `<img src="${u}" data-n="${esc(c[0])}" alt="" loading="lazy">` : svgIcon(c);
}
document.addEventListener("error", e => {      // якщо картинка не завантажилась, повертаємо SVG
  const i = e.target;
  if(i.tagName === "IMG" && i.dataset.n){
    const c = byName(i.dataset.n);
    if(c){ delete IMG[c[7]]; c[6] = ""; }

// ===== Звук (WebAudio, без файлів) =====
let AC = null;
function audio(){
  if(!S.set.sound) return null;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
  }catch(e){ return null; }
  return AC;
}
function beep(freq, dur, type, vol, delay, slide){
  const a = audio(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {
  tick(p){ beep(360 + 560 * p, 0.035, "square", 0.045); },       // p: 1 = швидко, 0 = повільно
  click(){ beep(520, 0.06, "triangle", 0.12, 0, 320); },
  coin(){ beep(988, 0.08, "sine", 0.1); beep(1319, 0.16, "sine", 0.1, 0.07); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.28, "triangle", 0.16, i * 0.09)); beep(1568, 0.5, "sine", 0.1, 0.4); },
  lose(){ beep(220, 0.35, "sawtooth", 0.1, 0, 90); beep(165, 0.45, "sawtooth", 0.08, 0.15, 70); },
  drop(r){
    const n = {ww:1, ind:1, mil:2, res:3, cls:4, cov:5, gold:6}[r] || 1;
    for(let i = 0; i < n; i++) beep(440 * Math.pow(1.26, i), 0.22, "triangle", 0.14, i * 0.08);
  }
};

// ===== Анімація в JS (щоб звук збігався з рисками), плавне уповільнення =====
let skipNow = false;
function animate(dur, onFrame){
  return new Promise(res => {
    const t0 = performance.now();
    skipNow = false;
    (function step(now){
      const x = skipNow ? 1 : Math.min(1, (now - t0) / dur);
      onFrame(1 - Math.pow(1 - x, 4), x);          // easeOutQuart
      x < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}
function flash(cls){
  const w = document.querySelector(".wheelbox");
  w.classList.remove("flash-win", "flash-lose"); void w.offsetWidth; w.classList.add("flash-" + cls);
}

const WD = {uk:["Пн","Вт","Ср","Чт","Пт","Сб","Нд"], en:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]};
function coinSvg(n){
  const k = n >= 60 ? 3 : n >= 20 ? 2 : 1;
  let g = "";
  for(let i = 0; i < k; i++)
    g += `<ellipse cx="20" cy="${31 - i * 7}" rx="13" ry="5.5" fill="#b87a14"/><ellipse cx="20" cy="${28 - i * 7}" rx="13" ry="5.5" fill="#ffd34a" stroke="#fff3b0" stroke-opacity=".7"/>`;
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${g}</svg>`;
}
const chestSvg = () => `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="17" width="30" height="17" rx="3" fill="#1f9d57"/><rect x="5" y="10" width="30" height="10" rx="4" fill="#3ddc84"/><rect x="5" y="19" width="30" height="2" fill="#0d3a21" opacity=".5"/><rect x="17" y="17" width="6" height="9" rx="1.5" fill="#c6ff5a"/></svg>`;
function untilMidnight(){
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  const s = Math.max(0, Math.floor((m - n) / 1000));
  return [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(x => String(x).padStart(2, "0")).join(":");
}
function streak(){
  const today = new Date().getDate();
  let d = S.adv.days.includes(today) ? today : today - 1, n = 0;
  while(d >= 1 && S.adv.days.includes(d)){ n++; d--; }

}

const CIRC = 2 * Math.PI * 86;
function arcD(ch){            // зона виграшу симетрична відносно низу, де стоїть стрілка
  if(ch <= 0) return "";
  const a1 = (90 - 1.8 * ch) * Math.PI / 180, a2 = (90 + 1.8 * ch) * Math.PI / 180, r = 86;
  const p = a => [100 + r * Math.cos(a), 100 + r * Math.sin(a)].map(v => v.toFixed(2)).join(" ");
  return `M${p(a1)} A${r} ${r} 0 ${ch > 50 ? 1 : 0} 1 ${p(a2)}`;
}

  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  try{ localStorage.setItem("upg_lang", lang); }catch(e){}
  showRes(); renderEverything();
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; applyLang(); });

// ===== Навігація між сторінками =====
document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-page]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "page-" + b.dataset.page));
});

// ===== Апгрейд =====
$("go").onclick = async () => {
  if(busy){ skipNow = true; return; }                  // під час крутки кнопка працює як «Пропустити»
  if($("go").disabled) return;
  busy = true; SFX.click();
  const ch = chance(), ids = [...selInv], tg = target, coins = balStake;
  const names = S.inv.filter(i => ids.includes(i.id)).map(i => i.n);
  const delta = Math.random() * 360 - 180;             // де зупиниться стрілка відносно низу
  const win = Math.abs(delta) < ch * 1.8;              // зона виграшу: ±(шанс × 1.8°) навколо низу
  spinCh = ch; lastRes = null; showRes();
  duelSnap = {items:names, coins, target:tg};          // показуємо ставку й ціль з цінами
  S.inv = S.inv.filter(i => !ids.includes(i.id));      // ставка списується одразу
  addBal(-coins); selInv.clear(); balStake = 0; save(); renderInv(); renderStage();
  const a0 = curDeg, a1 = a0 + 360 * (S.set.fast ? 2 : 6) + (delta - lastDelta);
  let last = Math.floor(a0 / 6), lastT = 0;
  await animate(S.set.fast ? 1100 : 5200, (e, x) => {
    const a = a0 + (a1 - a0) * e, idx = Math.floor(a / 6), now = performance.now();
    $("ptr").setAttribute("transform", `rotate(${a} 100 100)`);
    if(idx !== last){ if(now - lastT > 28){ SFX.tick(1 - x); lastT = now; } last = idx; }
  });
  curDeg = a1; lastDelta = delta;
  if(duelSnap) duelSnap.win = win;
  S.upg++;
  if(win){ S.inv.push({id:++S.uid, n:tg}); S.wins++; }
  addFeed({t:"up", win, chance:ch, stake:names, coins, item:tg});
  setRes(win ? "win" : "lose", win ? "win" : "lose", win ? tg : "");
  busy = false; spinCh = null; save(); renderAll();
  win ? SFX.win() : SFX.lose(); flash(win ? "win" : "lose");
};

// швидкий вибір цілі: x2, x4… (за множником) та 35%, 55%… (за шансом)
$("quick").onclick = e => {
  const b = e.target.closest(".q");
  if(!b || busy || b.id === "gearBtn") return;
  const sv = stakeValue();
  if(sv <= 0) return setRes("e_pick", "lose");
  SFX.click(); clearDuel();
  pickNearest(b.dataset.x ? sv * +b.dataset.x : sv * S.set.edge / +b.dataset.c);
  renderStage(); markTarget();
};
$("mch").oninput = e => {                              // перетягуйте слайдер: ціль підбирається під потрібний шанс
  if(busy) return;
  const sv = stakeValue();
  if(sv <= 0){ renderStage(); return setRes("e_pick", "lose"); }
  clearDuel();
  pickNearest(sv * S.set.edge / +e.target.value);
  renderStage(); markTarget();
};
$("balRange").oninput = e => {
  if(busy) return;
  clearDuel();
  balStake = Math.min(+e.target.value, Math.floor(S.bal * 100) / 100);
  renderStage();
};

// ===== Інвентар і цілі =====
$("inv").onclick = e => {
  if(busy) return;
  const sell = e.target.closest("[data-sell]");
  if(sell){
    const id = +sell.dataset.sell, it = S.inv.find(i => i.id === id);
    addBal(byName(it.n)[1]); S.inv = S.inv.filter(i => i.id !== id); selInv.delete(id); SFX.coin();
    save(); renderAll(); return;
  }
  const c = e.target.closest("[data-id]");
  if(c){ const id = +c.dataset.id; selInv.has(id) ? selInv.delete(id) : selInv.add(id); SFX.click(); clearDuel(); renderInv(); renderStage(); }
};
$("sellSel").onclick = () => {
  if(busy) return;
  if(selInv.size) SFX.coin();
  S.inv.filter(i => selInv.has(i.id)).forEach(i => addBal(byName(i.n)[1]));
  S.inv = S.inv.filter(i => !selInv.has(i.id)); selInv.clear(); clearDuel(); save(); renderAll();
};
$("cat").onclick = e => {
  if(busy) return;
  const buy = e.target.closest("[data-buy]");
  if(buy){
    const c = byName(buy.dataset.buy);
    if(S.bal < c[1]) return setRes("e_money", "lose");
    addBal(-c[1]); S.inv.push({id:++S.uid, n:c[0]}); SFX.coin(); save(); renderAll(); return;
  }
  const c = e.target.closest(".skin");
  if(c){ target = c.dataset.n; SFX.click(); clearDuel(); renderStage(); markTarget(); }
};
$("q").oninput = () => renderCat(true); $("typeSel").onchange = () => renderCat(true);
$("range").onchange = () => renderCat(true); $("sort").onchange = () => renderCat(true);

// ===== Кейси =====
function draw(cs){
  let r = Math.random(), i = 0;
  for(; i < cs.ws.length - 1; i++){ r -= cs.ws[i]; if(r <= 0) break; }
  return cs.items[i];
}
$("cases").onclick = async e => {
  const b = e.target.closest("[data-case]");
  if(!b || busy) return;
  const cs = CASES.find(c => c.id === b.dataset.case);
  if(S.bal < cs.price) return setRes("e_money", "lose");
  busy = true; addBal(-cs.price); save(); renderStage(); SFX.click();
  const win = draw(cs), WIN_AT = 30, reel = $("reel"), strip = $("strip");
  const seq = Array.from({length:40}, (_, i) => i === WIN_AT ? win : draw(cs));
  reel.innerHTML = seq.map(n => card(byName(n))).join("");
  strip.classList.add("on");
  reel.style.transform = "translateX(0)";
  const x1 = 6 + WIN_AT * 104 + 50 - strip.clientWidth / 2 + (Math.random() * 40 - 20);
  let last = -1, lastT = 0;
  await animate(S.set.fast ? 900 : 3600, (e2, x) => {
    const px = x1 * e2, now = performance.now();
    reel.style.transform = `translateX(${-px}px)`;
    const idx = Math.floor((px + strip.clientWidth / 2 - 6) / 104);
    if(idx !== last){ if(last >= 0 && now - lastT > 28){ SFX.tick(1 - x); lastT = now; } last = idx; }
  });
  if(reel.children[WIN_AT]) reel.children[WIN_AT].classList.add("hit");
  S.inv.push({id:++S.uid, n:win}); S.cases++;
  addFeed({t:"case", c:cs.id, item:win});
  busy = false; save(); renderAll(); setRes("dropped", "win", " " + win);
  SFX.drop(byName(win)[2]);
};
$("cq").oninput = renderCases; $("csort").onchange = renderCases;

// ===== Календар =====
$("page-advent").onclick = e => {
  if(!e.target.closest("[data-claim]")) return;
  if(S.adv.m !== mon()) S.adv = {m:mon(), days:[]};
  const d = new Date().getDate();
  if(S.adv.days.includes(d)) return;
  const r = adventReward(d, daysInMonth());
  if(r.coins) addBal(r.coins); else S.inv.push({id:++S.uid, n:r.skin});
  S.adv.days.push(d); addFeed({t:"adv", d, r}); save();
  r.skin ? SFX.drop(byName(r.skin)[2]) : SFX.coin();
  advPop = d; renderAll(); renderAdvent();
};

// ===== Вікна: налаштування та інформація =====
const LIM = {edge:[1,300], max:[1,99], min:[0.01,50], bonus:[0,100000], secs:[1,86400]};
Object.keys(LIM).forEach(k => $("s_" + k).oninput = e => {
  const v = parseFloat(e.target.value);
  if(isNaN(v)) return;
  S.set[k] = Math.max(LIM[k][0], Math.min(LIM[k][1], v));
  if(k === "secs") nextBonus = Date.now() + S.set.secs * 1000;
  save(); renderStage();
});
function openSettings(){
  Object.keys(LIM).forEach(k => $("s_" + k).value = S.set[k]);
  $("settings").classList.remove("hide");
}
$("setBtn").onclick = openSettings; $("gearBtn").onclick = openSettings;
$("setClose").onclick = () => $("settings").classList.add("hide");
$("infoBtn").onclick = () => $("info").classList.remove("hide");
$("infoClose").onclick = () => $("info").classList.add("hide");

// ===== Бонус кожні N секунд, таймер календаря =====
setInterval(() => {
  if(Date.now() >= nextBonus){
    addBal(S.set.bonus); nextBonus = Date.now() + S.set.secs * 1000; save(); renderStage();
  }
  const s = Math.max(0, Math.ceil((nextBonus - Date.now()) / 1000));
  $("timerTxt").textContent = t("timer").replace("{n}", S.set.bonus).replace("{s}", s);
  $("bar").style.width = (100 - 100 * s / S.set.secs) + "%";
  const cd = $("advCd"); if(cd) cd.textContent = untilMidnight();
  if(new Date().getDate() !== advDay){ advDay = new Date().getDate(); renderAdvent(); }
}, 500);

// ===== Старт =====
for(let i = 0; i < 60; i++){            // риски на кільці колеса
  const a = i * 6 * Math.PI / 180, r1 = 92, r2 = i % 5 ? 94.5 : 97;
  $("ticks").insertAdjacentHTML("beforeend",
    `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + r2 * Math.sin(a)}" y2="${100 - r2 * Math.cos(a)}"/>`);
}
applyLang();
// loadImages(); // у опублікованій версії зовнішні картинки заблоковані, лишаються малюнки SVG

</script>
</body>
